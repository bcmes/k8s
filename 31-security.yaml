kind: ServiceAccount
apiVersion: v1
metadata:
  name: server

---
#kind: ClusterRole, a regra é valida para o cluster inteiro.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole 
metadata:
  name: server-read
rules: # as opcoes que foram liberadas aqui, pode ser vista no menu de opcoes,  `kubectl api-resources`
- apiGroups: [""]
  resources: ["pods","services"]
  verbs: ["get","watch","list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get","watch","list"]  

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: server-read-bind
subjects:
- kind: ServiceAccount
  name: server
  namespace: prod
roleRef:
  kind: ClusterRole
  name: server-read
  apiGroup: rbac.authorization.k8s.io
