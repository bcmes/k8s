kind: ServiceAccount
apiVersion: v1
metadata:
  name: server

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole #kind: ClusterRole, a regra é valida para o cluster inteiro. o kind: Role será aplicado só no namespace: prod citado na linha 28, abaixo
metadata:
  name: server-read
rules: # as opcoes que foram liberadas aqui, pode ser vista no menu de opcoes,  `kubectl api-resources`
- apiGroups: [""]
  resources: ["pods","services"]
  verbs: ["get","watch","list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get","watch","list"]  

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding # devido a explicacao da linha 8 acima, aqui eu mudei de kind: RoleBinding para kind: ClusterRoleBinding
metadata:
  name: server-read-bind
subjects:
- kind: ServiceAccount
  name: server
  namespace: prod # A Role vai atuar neste namespace
roleRef:
  kind: ClusterRole # devido a explicacao da linha 22 eu mudei de kind: Role para kind: ClusterRole
  name: server-read
  apiGroup: rbac.authorization.k8s.io
